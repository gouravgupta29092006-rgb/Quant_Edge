# ═══════════════════════════════════════════════════════════
# QuantEdge — Production Profile
# Uses Neon PostgreSQL (Free) + Upstash Redis (Free)
# ═══════════════════════════════════════════════════════════

spring:
  # ─── Neon PostgreSQL (Free Tier — 0.5 GB) ───────────────
  # Connection string from Neon dashboard:
  # postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: QuantEdge-Prod-Pool
      maximum-pool-size: 5          # Neon free tier has connection limits
      minimum-idle: 1
      idle-timeout: 600000          # Neon serverless — release idle connections
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      # Neon requires SSL
      data-source-properties:
        sslmode: require

  # ─── Upstash Redis (Free — 10k commands/day) ────────────
  # Connection string from Upstash dashboard:
  # rediss://default:password@hostname:6380
  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true               # Upstash requires SSL
      lettuce:
        pool:
          max-active: 4             # Stay within free tier limits
          max-idle: 2
          min-idle: 0

  # ─── Email (Resend Free — 100/day) ──────────────────────
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ─── Production logging ───────────────────────────────────
logging:
  level:
    root: WARN
    com.quantedge: INFO
    org.springframework.security: WARN
  file:
    name: /tmp/quantedge.log

# ─── Production Swagger — disable for security ────────────
springdoc:
  swagger-ui:
    enabled: false      # Disable in production
  api-docs:
    enabled: false

quantedge:
  email:
    dev-mode: false    # Send real emails in production
  security:
    bcrypt-rounds: 12
