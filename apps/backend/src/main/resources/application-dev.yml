# ═══════════════════════════════════════════════════════════
# QuantEdge — Development Profile
# Uses local Docker PostgreSQL + Redis
# ═══════════════════════════════════════════════════════════

spring:
  # ─── Local PostgreSQL (Docker Compose) ──────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quantedge}
    username: ${DATABASE_USERNAME:quantedge_user}
    password: ${DATABASE_PASSWORD:devpassword123}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: QuantEdge-Dev-Pool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      connection-test-query: SELECT 1

  # ─── Local Redis (Docker Compose) ───────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:devpassword123}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ─── Dev: show SQL queries ──────────────────────────────
  jpa:
    show-sql: true

  # ─── Dev: log emails to console ─────────────────────────
  mail:
    host: localhost
    port: 1025       # MailHog / dev SMTP

# ─── Dev: more verbose logging ────────────────────────────
logging:
  level:
    com.quantedge: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ─── Dev: Swagger UI always accessible ────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true

quantedge:
  email:
    dev-mode: true   # Always log emails in dev, never send
