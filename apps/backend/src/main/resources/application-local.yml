# ─────────────────────────────────────────────────────────────────────────────
# Local development profile — runs WITHOUT Redis
# Activate with: -Dspring.profiles.active=local
# PostgreSQL must be running on localhost:5432
# ─────────────────────────────────────────────────────────────────────────────

spring:
  # Use simple in-memory cache instead of Redis
  cache:
    type: simple

  # Disable Redis auto-configuration entirely for local dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailAutoConfiguration

  # Disable mail for dev (no SMTP server needed)
  mail:
    host: localhost
    port: 1025

logging:
  level:
    root: INFO
    com.quantedge: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    # Suppress Redis connection warnings
    io.lettuce: WARN
    org.springframework.data.redis: WARN