spring:
  application:
    name: quantedge-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quantedge}
    username: ${SPRING_DATASOURCE_USERNAME:quantedge_user}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword123}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: QuantEdgePool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:devpassword123}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  cache:
    type: simple
    redis:
      time-to-live: 300000
      cache-null-values: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/html,text/css
    min-response-size: 1024

quantedge:
  security:
    jwt-secret: ${JWT_SECRET:quantedge_dev_jwt_secret_key_must_be_at_least_512_bits_long_for_hs512}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    bcrypt-rounds: 12
    max-failed-logins: 5
    lock-duration-minutes: 15
  # JWT aliases — JwtService uses quantedge.jwt.* keys
  jwt:
    secret: ${JWT_SECRET:quantedge_dev_jwt_secret_key_must_be_at_least_512_bits_long_for_hs512}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
    interim-token-expiry-ms: 300000
  market:
    finnhub-api-key: ${FINNHUB_API_KEY:}
    alpha-vantage-api-key: ${ALPHA_VANTAGE_API_KEY:}
    cache-ttl-seconds: 30
    historical-cache-ttl-seconds: 3600
  email:
    from: "QuantEdge <noreply@quantedge.app>"
    dev-mode: ${EMAIL_DEV_MODE:true}
  portfolio:
    max-per-user: 5
    default-initial-cash: 100000.00
  rate-limit:
    global-per-minute: 60
    auth-per-15-minutes: 10
    ai-per-hour: 20
    search-per-second: 5
    trade-per-second: 1
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-1.5-flash}

logging:
  level:
    root: WARN
    com.quantedge: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} [%level] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized