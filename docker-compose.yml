version: '3.9'

# QuantEdge — Full local development stack (₹0 cost)
# Usage:
#   docker compose up -d           # Start all services
#   docker compose up postgres redis -d   # Start DB only (for local backend dev)
#   docker compose down            # Stop all services
#   docker compose logs -f backend # Follow backend logs

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: quantedge_postgres
    environment:
      POSTGRES_DB:       quantedge
      POSTGRES_USER:     ${POSTGRES_USER:-quantedge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantedge_user} -d quantedge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Redis Cache ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: quantedge_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpassword123} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Spring Boot Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: quantedge_backend
    environment:
      SPRING_PROFILES_ACTIVE:      docker
      SPRING_DATASOURCE_URL:       jdbc:postgresql://postgres:5432/quantedge
      SPRING_DATASOURCE_USERNAME:  ${POSTGRES_USER:-quantedge_user}
      SPRING_DATASOURCE_PASSWORD:  ${POSTGRES_PASSWORD:-devpassword123}
      SPRING_DATA_REDIS_HOST:      redis
      SPRING_DATA_REDIS_PORT:      6379
      SPRING_DATA_REDIS_PASSWORD:  ${REDIS_PASSWORD:-devpassword123}
      JWT_SECRET:                  ${JWT_SECRET:-quantedge_jwt_super_secret_key_please_change_in_prod}
      FINNHUB_API_KEY:             ${FINNHUB_API_KEY:-}
      ALPHA_VANTAGE_API_KEY:       ${ALPHA_VANTAGE_API_KEY:-}
      OLLAMA_BASE_URL:             ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL:                ${OLLAMA_MODEL:-mistral}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # ── Next.js Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantedge_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_WS_URL:  ${NEXT_PUBLIC_WS_URL:-http://localhost:8080/ws}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: quantedge_network
